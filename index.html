<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="main.css" rel="stylesheet">
  <script src="build/main.js" type="module"></script>
</head>

<body>
  <h1>Restaurants</h1>

  <div id="auth-bar">
    <span id="user-info"></span>
    <button id="open-auth">Login / Register</button>
    <button id="logout" hidden>Logout</button>
  </div>

  <h2>Filter restaurants</h2>
  <div id="napit">
    <select id="city-filter">
      <option value="">All cities</option>
    </select>
    <select id="company-filter">
      <option value="">All providers</option>
    </select>
    <input id="search" type="search" placeholder="Search by name">
    <button id="reset">Clear filters</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Address</th>
        <th>Company</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- modal -->
  <dialog>
    <!-- add restaurant info here when restaurant is clicked -->
  </dialog>

  <!-- login / register modal (must stay after the restaurant dialog) -->
  <dialog id="auth-dialog">
    <h3>Login</h3>
    <form id="login-form">
      <input name="username" placeholder="Username" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <h3>Register</h3>
    <form id="register-form">
      <input name="username" placeholder="Username" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Register</button>
    </form>

    <p id="auth-message"></p>
    <button type="button" id="close-auth">Close</button>
  </dialog>
</body>

</html>
